<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>LAN Hosts</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#162033;--mut:#64748b;--bd:#e2e8f2;--ac:#2563eb;--ac2:#1d4ed8;--acs:#e8f0ff;
--ok:#16a34a;--oks:#dcfce7;--ko:#dc2626;--kos:#fee2e2;--idle:#94a3b8;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:12px 16px;
 padding-top:calc(12px + env(safe-area-inset-top));box-shadow:0 2px 12px #1e3a8a33}
.bar{max-width:920px;margin:auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo svg{width:28px;height:28px}h1{margin:0;font-size:19px;letter-spacing:.2px}
.ttl{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}h1{white-space:nowrap}
.pill{background:#ffffff26;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:#ffffff22;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.ib:hover{background:#ffffff40}.ib:active{transform:scale(.94)}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
 background:var(--ac);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--ac2)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:default}
.btn.soft{background:var(--acs);color:var(--ac2)}.btn.soft:hover{background:#d6e4ff}
.btn.red{background:var(--kos);color:#991b1b}.btn.red:hover{background:#fecaca}.btn.grey{background:#eef2f7;color:var(--tx)}
main{max-width:920px;margin:18px auto;padding:0 14px}
.tools{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;position:relative}.search svg{position:absolute;left:12px;top:11px;color:var(--mut);width:18px}
.search input{width:100%;padding:11px 12px 11px 38px}
input{font:inherit;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);min-width:0;width:100%}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #2563eb22}
.opts{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;min-width:0;padding:2px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fc{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--bd);background:#fff;color:var(--mut);border-radius:99px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.fc.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sort{display:flex;gap:6px;align-items:center;flex:1 1 100%}
.sort select{flex:1}
.sort select{font:inherit;font-size:14px;font-weight:600;padding:8px 10px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}
.dirb{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);display:grid;place-items:center;cursor:pointer}
.dirb svg{width:18px;height:18px;transition:transform .2s}.dirb.desc svg{transform:scaleY(-1)}
.list{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--bd);
 display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dot main" "act act";gap:12px 14px;align-items:center;--c:var(--idle);box-shadow:inset 5px 0 0 var(--c),0 1px 3px #1e293b14}
.card.up{--c:var(--ok)}.card.down{--c:var(--ko)}
.dot{grid-area:dot;align-self:start;margin:5px 0 0 6px;width:14px;height:14px;border-radius:50%;background:var(--idle)}
.up .dot{background:var(--ok);box-shadow:0 0 0 5px var(--oks)}.down .dot{background:var(--ko);box-shadow:0 0 0 5px var(--kos)}
.main{grid-area:main;min-width:0}.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:6px;align-items:center}
.chip{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f5f9;border-radius:8px;padding:3px 8px;color:#334155}
.st{font-size:13px;font-weight:600}.up .st{color:var(--ok)}.down .st{color:var(--ko)}.idle .st{color:var(--mut)}
.act{grid-area:act;display:grid;grid-template-columns:1fr 46px;gap:8px}
.act .btn{padding:10px}
@media(min-width:640px){.card{grid-template-columns:auto 1fr auto;grid-template-areas:"dot main act"}.act{grid-template-columns:auto 46px}.act .btn:first-child{padding:10px 18px}}
.empty{text-align:center;color:var(--mut);padding:40px 16px;background:var(--card);border-radius:var(--r);border:1px dashed var(--bd)}
.empty svg{width:40px;height:40px;margin-bottom:8px;color:var(--idle)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));height:56px;padding:0 22px;border-radius:28px;box-shadow:0 6px 20px #2563eb55;z-index:4}
dialog{border:0;border-radius:20px;padding:0;width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px);color:var(--tx);box-shadow:0 20px 60px #0f172a55}
dialog::backdrop{background:#0f172a66;backdrop-filter:blur(2px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}.dh h2{margin:0;font-size:18px}
.db{padding:8px 18px 18px;display:grid;gap:12px}.x{background:#eef2f7;color:var(--tx);width:36px;height:36px}
label{font-size:13px;font-weight:600;color:var(--mut);display:grid;gap:5px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.found{display:grid;gap:8px;max-height:55vh;overflow:auto}
.f{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.f .main{flex:1}.f .sub{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}.done{color:var(--ok);font-weight:600;font-size:13px}
hr{border:0;border-top:1px solid var(--bd);margin:4px 0;width:100%}code{background:#f1f5f9;padding:1px 5px;border-radius:6px}
.sel{font:inherit;padding:8px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}
.keyv{font:13px ui-monospace,Menlo,monospace;background:#fef9c3;border-radius:10px;padding:10px;overflow-wrap:anywhere;user-select:all;color:#422006}
.note{font-size:13px;color:var(--mut)}
@media(max-width:560px){dialog{margin:auto auto 12px}}
#msg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#162033;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
#msg.on{opacity:1;transform:translateX(-50%)}
</style></head><body>
<header><div class="bar">
 <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
 <div class="ttl"><h1>LAN Hosts</h1><span class="pill" id="sum">…</span></div></div>
 <button class="ib" id="refresh" title="Actualiser"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
 <button class="ib" id="rescan" title="Rescanner le réseau (suivre les changements d’IP)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
 <button class="ib" id="scan" title="Détecter"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg></button>
 <button class="ib" id="netbtn" title="Réseaux autorisés"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></button>
</div></header>
<main>
 <div class="tools"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="Rechercher un hôte" autocomplete="off"></div></div>
 <div class="opts"><div class="chips" id="chips"></div>
  <div class="sort"><select id="sortsel" aria-label="Trier par"><option value="name">Nom</option><option value="ip">Adresse IP</option><option value="mac">Adresse MAC</option><option value="state">État</option><option value="seen">Dernière vue</option></select>
  <button class="dirb" id="dirb" title="Inverser l’ordre" aria-label="Inverser l’ordre"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></div></div>
 <div class="list" id="list"></div>
</main>
<button class="btn fab" id="addbtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>

<dialog id="dlg"><form method="dialog" id="hf">
 <div class="dh"><h2 id="dt">Ajouter un hôte</h2><button type="button" class="ib x" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="db">
  <label>Nom<input name="name" required maxlength="80" autocomplete="off"></label>
  <label>Adresse IP<input name="ip" placeholder="192.168.1.10" inputmode="decimal" autocomplete="off"></label>
  <label>Adresse MAC<input name="mac" placeholder="aa:bb:cc:dd:ee:ff" autocomplete="off" autocapitalize="off"></label>
  <div class="note">L’IP sert à savoir si l’hôte est allumé, la MAC sert à le réveiller.</div>
  <div class="row2"><button type="button" class="btn red" id="del" hidden>Supprimer</button><button class="btn" id="save">Enregistrer</button></div>
 </div></form></dialog>

<dialog id="sdlg"><div class="dh"><h2>Hôtes détectés</h2><button class="ib x" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="db"><div class="found" id="found"></div></div></dialog>

<dialog id="ndlg"><form id="nf"><div class="dh"><h2>Accès et clés API</h2><button type="button" class="ib x" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="db"><div class="note" id="netinfo"></div>
 <label>Réseaux supplémentaires<input name="nets" placeholder="10.0.0.0/24, 100.64.0.0/10" autocomplete="off"></label>
 <button class="btn">Enregistrer les réseaux</button>
 <hr><div class="note"><b>Clés API</b> : pour piloter les hôtes depuis un script. Utilise l’en-tête <code>X-API-Key</code>. Documentation : <a href="api/docs" target="_blank">api/docs</a>.</div>
 <div id="keys" class="found"></div>
 <div class="row2"><input id="kname" placeholder="Nom de la clé" maxlength="60"><select id="kscope" class="sel"><option value="write">Lecture + actions</option><option value="read">Lecture seule</option></select></div>
 <button type="button" class="btn soft" id="kadd">Créer une clé</button>
 <div id="newkey" class="note" hidden></div></div></form></dialog>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s);
const IC={pow:'<path d="M12 3v9M6.4 6.6a8 8 0 1 0 11.2 0"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
 srv:'<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/>',
 plus:'<path d="M12 5v14M5 12h14"/>'};
function ic(n){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.innerHTML=IC[n];return s}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
let tt;function toast(t){const m=$('#msg');m.textContent=t;m.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>m.classList.remove('on'),2800)}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}if(Array.isArray(d))d='Valeur invalide';throw new Error(d||('Erreur '+r.status))}return r.status==204?null:r.json()}
function ago(ts){if(!ts)return'jamais vu';const s=Math.round(Date.now()/1000-ts);return s<90?'vu à l’instant':s<5400?'vu il y a '+Math.round(s/60)+' min':s<172800?'vu il y a '+Math.round(s/3600)+' h':'vu il y a '+Math.round(s/86400)+' j'}
let HOSTS=[];
const FILTERS=[['all','Tous'],['up','Allumés'],['down','Éteints'],['idle','Inconnus']];
const SORTS={name:h=>h.name.toLowerCase(),ip:h=>h.ip?h.ip.split('.').reduce((a,b)=>a*256+ +b,0):null,mac:h=>h.mac,
 state:h=>h.up===1?0:h.up===0?1:2,seen:h=>h.last_seen};
let VIEW=Object.assign({filter:'all',sort:'name',desc:false},JSON.parse(localStorage.getItem('lanview')||'{}'));
function saveView(){localStorage.setItem('lanview',JSON.stringify(VIEW))}
function stateOf(h){return h.up===1?'up':h.up===0?'down':'idle'}
function sorted(hs){const f=SORTS[VIEW.sort]||SORTS.name,d=VIEW.desc?-1:1;
 return hs.slice().sort((a,b)=>{const x=f(a),y=f(b);if(x==null&&y==null)return a.name.localeCompare(b.name);if(x==null)return 1;if(y==null)return -1;
  return (x<y?-1:x>y?1:a.name.localeCompare(b.name))*d})}
function render(){const f=$('#q').value.trim().toLowerCase();const l=$('#list');l.replaceChildren();
 const up=HOSTS.filter(h=>h.up===1).length;$('#sum').textContent=HOSTS.length?up+' / '+HOSTS.length+' allumés':'aucun hôte';
 const ch=$('#chips');ch.replaceChildren();for(const [k,t] of FILTERS){const n=k==='all'?HOSTS.length:HOSTS.filter(h=>stateOf(h)===k).length;
  const b=el('button','fc'+(VIEW.filter===k?' on':''),t+' '+n);b.onclick=()=>{VIEW.filter=k;saveView();render()};ch.append(b)}
 $('#sortsel').value=VIEW.sort;$('#dirb').classList.toggle('desc',VIEW.desc);
 const hs=sorted(HOSTS.filter(h=>(VIEW.filter==='all'||stateOf(h)===VIEW.filter)&&(!f||[h.name,h.ip,h.mac].join(' ').toLowerCase().includes(f))));
 if(!hs.length){const e=el('div','empty');e.append(ic('srv'));e.append(el('div',null,HOSTS.length?'Aucun résultat.':'Aucun hôte pour l’instant. Ajoute-en un ou lance une détection.'));l.append(e)}
 for(const h of hs){const k=stateOf(h);const c=el('div','card '+(k==='idle'?'':k)+' '+k);
  c.append(el('span','dot'));const m=el('div','main');m.append(el('div','name',h.name));
  const meta=el('div','meta');meta.append(el('span','st',h.up===1?'Allumé':h.up===0?'Éteint · '+ago(h.last_seen):'Pas encore testé'));
  if(h.ip)meta.append(el('span','chip',h.ip));if(h.mac)meta.append(el('span','chip',h.mac));m.append(meta);c.append(m);
  const a=el('div','act');const w=el('button','btn soft');w.append(ic('pow'),document.createTextNode('Réveiller'));w.disabled=!h.mac;
  w.onclick=async()=>{try{await api('POST','api/hosts/'+h.id+'/wake');toast('Paquet de réveil envoyé à '+h.name)}catch(e){toast(e.message)}};
  const ed=el('button','btn grey');ed.title='Modifier';ed.append(ic('edit'));ed.onclick=()=>openDlg(h);a.append(w,ed);c.append(a);l.append(c)}}
async function load(){try{HOSTS=await api('GET','api/hosts');render()}catch(e){toast(e.message)}}
let cur=null;const dlg=$('#dlg'),hf=$('#hf');
function openDlg(h){cur=h;$('#dt').textContent=h?'Modifier l’hôte':'Ajouter un hôte';hf.name.value=h?h.name:'';hf.ip.value=h&&h.ip||'';hf.mac.value=h&&h.mac||'';
 $('#del').hidden=!h;dlg.showModal();if(!h)hf.name.focus()}
$('#addbtn').onclick=()=>openDlg(null);
hf.onsubmit=async e=>{e.preventDefault();const d={name:hf.name.value,ip:hf.ip.value||null,mac:hf.mac.value||null};
 try{if(cur)await api('PUT','api/hosts/'+cur.id,d);else await api('POST','api/hosts',d);dlg.close();await load();toast('Enregistré');if(d.ip)refresh(true)}catch(x){toast(x.message)}};
$('#del').onclick=async()=>{if(confirm('Supprimer '+cur.name+' ?')){await api('DELETE','api/hosts/'+cur.id);dlg.close();load()}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
async function refresh(quiet){const b=$('#refresh');b.classList.add('spin');b.disabled=true;
 try{HOSTS=await api('POST','api/refresh');render();if(!quiet)toast('État mis à jour')}catch(e){toast(e.message)}b.classList.remove('spin');b.disabled=false}
$('#refresh').onclick=()=>refresh();
$('#rescan').onclick=async()=>{const b=$('#rescan');b.classList.add('spin');b.disabled=true;toast('Rescan du réseau en cours…');
 try{const r=await api('POST','api/rescan');HOSTS=r.hosts;render();
  toast(r.changes.length?r.changes.map(c=>c.name+' : '+(c.old||'?')+' → '+c.new).join(' · '):'Rescan terminé, aucune IP n’a changé')}catch(e){toast(e.message)}b.classList.remove('spin');b.disabled=false};
$('#q').oninput=render;
$('#sortsel').onchange=e=>{VIEW.sort=e.target.value;saveView();render()};
$('#dirb').onclick=()=>{VIEW.desc=!VIEW.desc;saveView();render()};
$('#scan').onclick=async()=>{const b=$('#scan');b.classList.add('spin');b.disabled=true;toast('Détection en cours…');
 try{const fs=await api('POST','api/scan');const c=$('#found');c.replaceChildren();
  if(!fs.length)c.append(el('div','note','Rien trouvé.'));
  for(const f of fs){const r=el('div','f');const m=el('div','main');m.append(el('div','name',f.ip));m.append(el('div','sub',f.mac+(f.vendor&&f.vendor!=='(Unknown)'?' · '+f.vendor:'')));r.append(m);
   if(f.known)r.append(el('span','done','Déjà ajouté'));else{const a=el('button','btn soft','Ajouter');a.onclick=()=>{$('#sdlg').close();openDlg(null);hf.name.value=f.vendor&&f.vendor!=='(Unknown)'?f.vendor:'';hf.ip.value=f.ip;hf.mac.value=f.mac;hf.name.focus()};r.append(a)}c.append(r)}
  $('#sdlg').showModal()}catch(x){toast(x.message)}b.classList.remove('spin');b.disabled=false};
async function loadKeys(){const c=$('#keys');c.replaceChildren();const ks=await api('GET','api/keys');
 if(!ks.length)c.append(el('div','note','Aucune clé.'));
 for(const k of ks){const r=el('div','f');const m=el('div','main');m.append(el('div','name',k.name));
  m.append(el('div','sub',k.prefix+'… · '+(k.scope==='read'?'lecture seule':'lecture + actions')+' · '+(k.last_used?ago(k.last_used).replace('vu','utilisée'):'jamais utilisée')));r.append(m);
  const d=el('button','btn red','Révoquer');d.onclick=async()=>{if(confirm('Révoquer la clé '+k.name+' ?')){await api('DELETE','api/keys/'+k.id);loadKeys()}};r.append(d);c.append(r)}}
$('#kadd').onclick=async()=>{const n=$('#kname').value.trim();if(!n){toast('Donne un nom à la clé');return}
 try{const r=await api('POST','api/keys',{name:n,scope:$('#kscope').value});const o=$('#newkey');o.hidden=false;o.replaceChildren();
  o.append(el('div',null,'Copie cette clé maintenant, elle ne sera plus affichée :'));o.append(el('div','keyv',r.key));$('#kname').value='';loadKeys()}catch(x){toast(x.message)}};
$('#netbtn').onclick=async()=>{try{$('#newkey').hidden=true;loadKeys();const n=await api('GET','api/networks');
 $('#netinfo').textContent='Ton adresse : '+n.your_ip+'. Réseaux du serveur : '+[...new Set(n.detected)].join(', ')+(n.from_env.length?'. Configurés : '+n.from_env.join(', '):'')+'.';
 $('#nf').nets.value=n.extra.join(', ');$('#ndlg').showModal()}catch(x){toast(x.message)}};
$('#nf').onsubmit=async e=>{e.preventDefault();try{await api('PUT','api/networks',{networks:e.target.nets.value.split(',').map(s=>s.trim()).filter(Boolean)});$('#ndlg').close();toast('Enregistré')}catch(x){toast(x.message)}};
load();setInterval(load,15000);
</script></body></html>
