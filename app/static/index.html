<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Hosts</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1d2733;--mut:#6b7a8c;--ok:#16a34a;--ko:#dc2626;--ac:#2563eb;--bd:#e3e9f1}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:20px}main{max-width:900px;margin:24px auto;padding:0 16px}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:#e8eef7;color:var(--tx)}button.dng{background:#fee2e2;color:#991b1b}button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#cbd5e1;flex:none}.up .dot{background:var(--ok)}.down .dot{background:var(--ko)}
.info{flex:1;min-width:0}.name{font-weight:600}.sub{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
input{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;min-width:0}
form{display:flex;flex-wrap:wrap;gap:8px}h2{font-size:16px;margin:0 0 10px}.empty{color:var(--mut);text-align:center;padding:24px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2733;color:#fff;padding:8px 16px;border-radius:8px;display:none}
</style></head><body>
<header><h1>🖧 LAN Hosts</h1><div>
<button class="sec" id="refresh">Actualiser</button> <button id="scan">Détecter</button>
<button class="sec" id="netbtn">Réseaux autorisés</button></div></header>
<main>
<div class="panel"><h2>Ajouter un hôte</h2><form id="add">
<input name="name" placeholder="Nom" required><input name="ip" placeholder="Adresse IP"><input name="mac" placeholder="Adresse MAC (aa:bb:…)">
<button>Ajouter</button></form></div>
<div class="panel" id="scanpanel" hidden><h2>Hôtes détectés</h2><div id="found"></div></div>
<div class="panel" id="netpanel" hidden><h2>Réseaux autorisés</h2><div class="sub" id="netinfo"></div>
<form id="netform"><input name="nets" size="40" placeholder="Réseaux supplémentaires, ex. 10.0.0.0/24"><button>Enregistrer</button></form></div>
<div id="list"></div></main><div id="msg"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3000)}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}throw new Error(d||r.status)}return r.status==204?null:r.json()}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function ago(ts){if(!ts)return'jamais vu';const s=Math.round(Date.now()/1000-ts);return s<90?'vu à l’instant':s<5400?'vu il y a '+Math.round(s/60)+' min':s<172800?'vu il y a '+Math.round(s/3600)+' h':'vu il y a '+Math.round(s/86400)+' j'}
async function load(){const hs=await api('GET','/api/hosts');const l=$('#list');l.replaceChildren();
 if(!hs.length)l.append(el('div','empty','Aucun hôte. Ajoute-en un ou lance une détection.'));
 for(const h of hs){const r=el('div','row '+(h.up===1?'up':h.up===0?'down':''));r.append(el('span','dot'));
  const i=el('div','info');i.append(el('div','name',h.name));
  i.append(el('div','sub',[h.ip,h.mac,h.up===1?'allumé':h.up===0?'éteint · '+ago(h.last_seen):'pas encore testé'].filter(Boolean).join(' · ')));r.append(i);
  const w=el('button','sec','Réveiller');w.disabled=!h.mac;w.onclick=async()=>{try{await api('POST',`/api/hosts/${h.id}/wake`);toast('Paquet Wake-on-LAN envoyé')}catch(e){toast(e.message)}};
  const d=el('button','dng','Supprimer');d.onclick=async()=>{if(confirm('Supprimer '+h.name+' ?')){await api('DELETE','/api/hosts/'+h.id);load()}};
  r.append(w,d);l.append(r)}}
$('#add').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 try{await api('POST','/api/hosts',f);e.target.reset();load()}catch(x){toast(x.message)}};
$('#refresh').onclick=async()=>{await api('POST','/api/refresh');load()};
$('#scan').onclick=async e=>{e.target.disabled=true;e.target.textContent='Détection…';
 try{const fs=await api('POST','/api/scan');$('#scanpanel').hidden=false;const c=$('#found');c.replaceChildren();
  if(!fs.length)c.append(el('div','empty','Rien trouvé.'));
  for(const f of fs){const r=el('div','row');const i=el('div','info');i.append(el('div','name',f.ip));i.append(el('div','sub',f.mac+(f.vendor?' · '+f.vendor:'')));r.append(i);
   if(f.known)r.append(el('span','sub','déjà ajouté'));else{const b=el('button',null,'Ajouter');b.onclick=async()=>{const n=prompt('Nom de cet hôte ?',f.vendor||f.ip);if(!n)return;
     await api('POST','/api/hosts',{name:n,ip:f.ip,mac:f.mac});b.disabled=true;load()};r.append(b)}c.append(r)}}
 catch(x){toast(x.message)}e.target.disabled=false;e.target.textContent='Détecter'};
$('#netbtn').onclick=async()=>{const p=$('#netpanel');p.hidden=!p.hidden;if(p.hidden)return;const n=await api('GET','/api/networks');
 $('#netinfo').textContent='Ton IP : '+n.your_ip+' · détectés : '+n.detected.join(', ')+(n.from_env.length?' · config : '+n.from_env.join(', '):'');
 $('#netform').nets.value=n.extra.join(', ')};
$('#netform').onsubmit=async e=>{e.preventDefault();try{await api('PUT','/api/networks',{networks:e.target.nets.value.split(',').map(s=>s.trim()).filter(Boolean)});toast('Enregistré')}catch(x){toast(x.message)}};
load();setInterval(load,15000);
</script></body></html>
