services:
  lan-hosts:
    image: ghcr.io/worxfr/lan-hosts:latest
    container_name: lan-hosts
    restart: unless-stopped
    # ARP and Wake-on-LAN broadcasts must reach the LAN: host network mode.
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      PORT: "8088"
      # Set these in a .env file next to this one (see README).
      HOST: ${HOST:-0.0.0.0}                    # address to listen on; use the proxy's gateway to hide the port from the LAN
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:-}   # extra networks (the host's own LAN is always allowed)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}     # reverse proxies whose X-Forwarded-For is trusted
      ROOT_PATH: ${ROOT_PATH:-}                 # sub-path when served behind a proxy, e.g. /lan-hosts (for /api/docs)
      API_KEYS_BYPASS_ACL: ${API_KEYS_BYPASS_ACL:-true}  # a valid API key works from any network
    volumes:
      - lan-hosts-data:/data
volumes:
  lan-hosts-data:
